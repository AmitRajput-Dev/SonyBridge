name: macOS

on:
  push:
    branches:
    - main
    - 'feature/**'
  pull_request:
    branches:
    - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Protocol tests
      working-directory: ${{github.workspace}}/Client
      run: sh tests/run-macos.sh

    - name: Build
      working-directory: ${{github.workspace}}/Client/macos
      # Ad-hoc signed like the released app, so no signing identity is needed.
      run: xcodebuild -project SonyHeadphonesClient.xcodeproj -scheme SonyHeadphonesClient -configuration Release -derivedDataPath ../build CODE_SIGN_IDENTITY=- build

    - name: Zip the app
      working-directory: ${{github.workspace}}/Client/build/Build/Products/Release
      run: ditto -c -k --keepParent SonyHeadphonesClient.app ${{github.workspace}}/SonyHeadphonesClient-macOS.zip

    - name: Upload the zipped app
      uses: actions/upload-artifact@v4
      with:
        name: SonyHeadphonesClient-macOS
        path: ${{github.workspace}}/SonyHeadphonesClient-macOS.zip
